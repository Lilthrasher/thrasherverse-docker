services:
  gitea:
    image: docker.gitea.com/gitea:28.0.0-rootless
    container_name: gitea
    restart: always
    volumes:
      - gitea-data:/var/lib/gitea
      - gitea-config:/etc/gitea
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3001:3000"
      - "2222:2222"

volumes:
  gitea-data:
  gitea-config:
